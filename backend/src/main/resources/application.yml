spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/time_tracker
    username: postgres
    password: hello1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/time_tracker
    user: postgres
    password: hello1234
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
jwt:
  secret: secret
logging:
  level:
    org.springframework.security: DEBUG



